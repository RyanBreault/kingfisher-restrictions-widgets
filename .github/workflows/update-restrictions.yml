name: Update river restrictions
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-river-restrictions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Update restriction data
        run: python scripts/update_restrictions.py
      - name: Validate JSON
        run: python -m json.tool river-restrictions.json > /dev/null
      - name: Commit changes
        run: |
          if git diff --quiet -- river-restrictions.json; then
            echo "No changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add river-restrictions.json
          git commit -m "Update river restrictions"
          git push
